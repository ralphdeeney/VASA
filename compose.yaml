name: vasa-dev
services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: vasa
      POSTGRES_PASSWORD: vasa_local_only
      POSTGRES_DB: vasa
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vasa -d vasa"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
  evolution:
    profiles: ["calling"]
    image: vasa-evolution-calls:e21ce0dd
    build:
      context: .local/evolution-source
      dockerfile: ../../docker/evolution.Dockerfile
    env_file:
      - path: .local/evolution.env
        required: false
    environment:
      SERVER_PORT: "4000"
      CLIENT_NAME: "vasa"
      DATABASE_SAVE_MESSAGES: "false"
      POSTGRES_AUTH_DB: "postgresql://vasa:vasa_local_only@postgres:5432/vasa_evolution_auth?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://vasa:vasa_local_only@postgres:5432/vasa_evolution_users?sslmode=disable"
      WADEBUG: "WARN"
      LOGTYPE: "console"
      LOG_DIRECTORY: "/app/logs"
      WEBHOOK_FILES: "false"
      CONNECT_ON_STARTUP: "false"
      MINIO_ENABLED: "false"
      AMQP_GLOBAL_ENABLED: "false"
      NATS_GLOBAL_ENABLED: "false"
      OS_NAME: "VASA"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - evolution-data:/app/dbdata
      - evolution-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4000/server/ok"]
      interval: 5s
      timeout: 3s
      retries: 24
    user: "1000:1000"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    restart: "no"
  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
volumes:
  postgres-data:
  evolution-data:
  evolution-logs:
