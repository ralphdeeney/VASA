name: VASA staging VPS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only check, one-time voice bootstrap, or staging deployment
        type: choice
        options: [check, bootstrap, deploy]
        default: check
        required: true

permissions:
  contents: read

concurrency:
  group: vasa-staging-vps
  cancel-in-progress: false

jobs:
  staging:
    if: github.repository == 'ralphdeeney/VASA' && github.ref == 'refs/heads/build/vasa-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the requested branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify SSH trust and run the selected mode
        shell: bash
        env:
          VASA_VPS_HOST: ${{ secrets.VASA_VPS_HOST }}
          VASA_VPS_USER: ${{ secrets.VASA_VPS_USER }}
          VASA_VPS_SSH_KEY: ${{ secrets.VASA_VPS_SSH_KEY }}
          VASA_VPS_HOST_KEY_SHA256: ${{ vars.VASA_VPS_HOST_KEY_SHA256 }}
          VASA_DEPLOY_MODE: ${{ inputs.mode }}
        run: bash deploy/actions-ssh.sh
