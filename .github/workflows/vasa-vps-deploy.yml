name: VASA staging VPS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only check, one-time voice bootstrap, or staging deployment
        type: choice
        options: [check, bootstrap, deploy]
        default: check
        required: true
      recovery:
        description: Recovery inspection, preparation, or explicitly approved live migration/activation (check mode only)
        type: choice
        options: [none, investigate, prepare, activate, evolution_check, evolution_deploy]
        default: none
        required: false
      release_sha:
        description: Exact operator-approved immutable release SHA (activate only)
        type: string
        default: ''
        required: false
      migration_sql_sha256:
        description: SHA256 of operator-reviewed SQL (activate only; never automatic)
        type: string
        default: ''
        required: false
      saas_acceptance:
        description: Disposable live browser acceptance only (check mode, no recovery/smoke)
        type: boolean
        default: false
        required: false
      cleanup_only:
        description: Remove audited disposable test identities only (requires saas_acceptance)
        type: boolean
        default: false
        required: false
      recycle_api_pool:
        description: Restart only existing VASA web container before cleanup (requires cleanup_only)
        type: boolean
        default: false
        required: false
      provider_smoke:
        description: Opt-in paid live provider validation after deploy (deploy mode only)
        type: boolean
        default: false
        required: false
  push:
    branches:
      - build/vasa-foundation
    paths-ignore:
      - 'deploy/requests/**'
      # Controller/read-only recovery changes use explicit deployment requests.
      # Runtime/Compose changes still follow the normal application deployment.
      - 'deploy/actions*.py'
      - 'deploy/actions-ssh.sh'
      - 'deploy/request*.py'
      - 'deploy/request_schema.json'
      - 'deploy/deployment_*.py'
      - 'deploy/create_request.py'
      - 'deploy/health_diagnostics.py'
      - 'deploy/recovery_audit.py'
      - 'deploy/evolution_backups.py'
      - 'deploy/evolution_call_gate.py'
      - 'deploy/evolution_instance_check.py'
      - 'docs/**'
      - 'tests/**'
      - '*.md'
      - '.github/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: vasa-staging-vps
  cancel-in-progress: false

jobs:
  staging:
    if: github.repository == 'ralphdeeney/VASA' && github.ref == 'refs/heads/build/vasa-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the requested branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require successful CI before automatic application deployment
        if: github.event_name == 'push' || inputs.mode != 'check' || inputs.recovery == 'evolution_deploy' || inputs.recovery == 'activate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/wait_ci.py
      - name: Check approved SMTP secret bindings without revealing values
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check' && inputs.recovery != 'none' && !startsWith(inputs.recovery, 'evolution_')
        env:
          SMTP_HOST: ${{ secrets.VASA_SMTP_HOST || secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.VASA_SMTP_USERNAME || secrets.SMTP_USERNAME || secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.VASA_SMTP_PASSWORD || secrets.SMTP_PASSWORD }}
          SMTP_SENDER: ${{ secrets.VASA_SMTP_SENDER || secrets.SMTP_SENDER || secrets.SMTP_FROM }}
        run: |
          python3 - <<'PYTHON'
          import os
          for name in ("HOST", "USER", "PASSWORD", "SENDER"):
              state = "present" if os.environ.get("SMTP_" + name) else "absent"
              print("GITHUB_SMTP_BINDING_" + name + "=" + state)
          PYTHON
      - name: Install isolated browser tooling
        if: github.event_name == 'workflow_dispatch' && inputs.saas_acceptance && !inputs.cleanup_only
        shell: bash
        env:
          VASA_MODE: ${{ inputs.mode }}
          VASA_RECOVERY_OPTION: ${{ inputs.recovery }}
          VASA_SMOKE_OPTION: ${{ inputs.provider_smoke }}
        run: |
          [[ "$VASA_MODE" == check && "$VASA_RECOVERY_OPTION" == none && "$VASA_SMOKE_OPTION" == false ]] || exit 1
          mkdir -p "$RUNNER_TEMP/vasa-browser"
          npm install --prefix "$RUNNER_TEMP/vasa-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/vasa-browser/node_modules/.bin/playwright" install chromium
      - name: Verify SSH trust and run the selected mode
        id: deployment
        shell: bash
        env:
          VASA_VPS_HOST: ${{ secrets.VASA_VPS_HOST }}
          VASA_VPS_USER: ${{ secrets.VASA_VPS_USER }}
          VASA_VPS_SSH_KEY: ${{ secrets.VASA_VPS_SSH_KEY }}
          VASA_VPS_HOST_KEY_SHA256: ${{ vars.VASA_VPS_HOST_KEY_SHA256 }}
          VASA_SAAS_CLEANUP_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup_only && 'true' || 'false' }}
          VASA_API_POOL_RECYCLE: ${{ github.event_name == 'workflow_dispatch' && inputs.recycle_api_pool && 'true' || 'false' }}
          VASA_SAAS_ACCEPTANCE: ${{ github.event_name == 'workflow_dispatch' && inputs.saas_acceptance && 'true' || 'false' }}
          VASA_DEPLOY_MODE: ${{ github.event_name == 'push' && 'deploy' || inputs.mode }}
          VASA_RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || '' }}
          VASA_MIGRATION_SQL_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_sql_sha256 || '' }}
          VASA_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery || 'none' }}
          VASA_PROVIDER_SMOKE: ${{ github.event_name == 'workflow_dispatch' && inputs.provider_smoke && 'true' || 'false' }}
        run: |
          if [[ "$VASA_SAAS_CLEANUP_ONLY" == true || "$VASA_API_POOL_RECYCLE" == true ]]; then
            [[ "$VASA_SAAS_ACCEPTANCE" == true ]] || exit 1
          fi
          [[ "$VASA_API_POOL_RECYCLE" == false || "$VASA_SAAS_CLEANUP_ONLY" == true ]] || exit 1
          if [[ "$VASA_SAAS_ACCEPTANCE" == true ]]; then
            [[ "$VASA_DEPLOY_MODE" == check && "$VASA_RECOVERY" == none && "$VASA_PROVIDER_SMOKE" == false ]] || exit 1
            export NODE_PATH="$RUNNER_TEMP/vasa-browser/node_modules"
            python3 scripts/run_live_saas_acceptance.py
          else
            bash deploy/actions-ssh.sh
          fi
      - name: Write sanitized deployment summary
        if: always()
        env:
          VASA_TRIGGER: ${{ github.event_name }}
          VASA_TARGET_SHA: ${{ github.sha }}
          VASA_RESOLVED_MODE: ${{ github.event_name == 'push' && 'deploy' || inputs.mode }}
          VASA_SMOKE: ${{ github.event_name == 'workflow_dispatch' && inputs.provider_smoke && 'true' || 'false' }}
          VASA_RESULT: ${{ steps.deployment.outcome }}
        run: python3 deploy/actions_summary.py
