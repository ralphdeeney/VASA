name: VASA platform owner setup

on:
  workflow_dispatch:
    inputs:
      email:
        description: Explicit platform owner's recovery email (not a password)
        required: true
        type: string
      release_sha:
        description: Exact healthy active release with owner-login support
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: vasa-staging-vps
  cancel-in-progress: false

jobs:
  owner:
    if: github.repository == 'ralphdeeney/VASA' && github.ref == 'refs/heads/build/vasa-foundation' && github.actor == 'ralphdeeney'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require exact source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/wait_ci.py
      - name: Audited single-owner provisioning through existing SSH bridge
        env:
          VASA_VPS_HOST: ${{ secrets.VASA_VPS_HOST }}
          VASA_VPS_USER: ${{ secrets.VASA_VPS_USER }}
          VASA_VPS_SSH_KEY: ${{ secrets.VASA_VPS_SSH_KEY }}
          VASA_VPS_HOST_KEY_SHA256: ${{ vars.VASA_VPS_HOST_KEY_SHA256 }}
          VASA_DEPLOY_MODE: check
          VASA_RECOVERY: none
          VASA_PROVIDER_SMOKE: 'false'
          VASA_OWNER_PROVISION: 'true'
          VASA_OWNER_EMAIL: ${{ inputs.email }}
          VASA_OWNER_RELEASE: ${{ inputs.release_sha }}
          VASA_PLATFORM_ADMIN_PASSWORD: ${{ secrets.VASA_PLATFORM_ADMIN_PASSWORD }}
        run: bash deploy/actions-ssh.sh
