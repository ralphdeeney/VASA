<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Platform sign in · VASA</title><link rel="stylesheet" href="/dashboard/assets/styles.css" /><link rel="stylesheet" href="/dashboard/assets/admin.css" /><script src="/dashboard/assets/admin-login.js" defer></script></head>
<body class="admin-login-page"><main class="admin-login-shell" id="main"><a class="admin-login-brand" href="/" aria-label="VASA home"><img src="/dashboard/assets/vasa-logo.png" alt="VASA" width="132" height="109" /></a><p class="eyebrow">Platform administration</p><h1>Welcome back.</h1><p class="muted small">Sign in to manage VASA customers and platform access.</p><form id="admin-login-form"><div><label for="admin-username">Username</label><input id="admin-username" name="username" autocomplete="username" required maxlength="100" autocapitalize="none" spellcheck="false" /></div><div><label for="admin-login-password">Password</label><input id="admin-login-password" name="password" type="password" minlength="8" autocomplete="current-password" required maxlength="256" /></div><button id="admin-login-submit" type="submit">Sign in to platform</button></form><p id="admin-login-message" class="admin-login-status" role="status" aria-live="polite"></p><footer class="admin-login-footer"><a href="/login">Customer workspace sign in</a> · <a href="/forgot-password">Recover by email</a></footer></main></body>
</html>
