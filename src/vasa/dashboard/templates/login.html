<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · VASA</title>
    <link rel="stylesheet" href="/dashboard/assets/styles.css">
    <script src="/dashboard/assets/login.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-card">
      <a class="site-brand sign-in-brand" href="/" aria-label="VASA home"><img src="/dashboard/assets/vasa-logo.png" alt="VASA" width="661" height="548" /></a>
      <h1>Welcome back.</h1>
      <p class="muted">Sign in to manage your WhatsApp connection.</p>
      <form id="login-form" class="stack">
        <div>
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username"
                 maxlength="254" required>
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password"
                 minlength="8" maxlength="256" required>
        </div>
        <p id="login-error" class="notice error" role="alert" tabindex="-1" hidden></p>
        <button id="login-submit" type="submit">Sign in</button>
        <p id="login-status" class="muted small" role="status" aria-live="polite"></p>
      </form>
      <p class="small muted help-text"><a href="/forgot-password">Forgot password?</a> · <a href="/resend-verification">Resend verification</a> · <a href="/signup">Create an account</a> · <a href="/admin/login">Platform owner sign in</a></p>
      <noscript><p class="notice">Enable JavaScript to sign in and manage your connection.</p></noscript>
    </main>
  </body>
</html>
